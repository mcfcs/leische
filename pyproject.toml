[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leische"
version = "0.1.0"
description = "Context-Aware Sarcasm Detection in Code-Switching Social Media Posts — model repository (thesis)"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "transformers>=4.51,<5",
    "sentence-transformers>=4.1",
    "datasets>=3.5",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "pyarrow>=19",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "sentencepiece>=0.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "jupytext>=1.16",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leische"]

[tool.uv]
# torch cu124 wheels live on the PyTorch index only
[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
