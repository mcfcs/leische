[project]
name = "leische"
version = "0.1.0"
description = "Context-Aware Sarcasm Detection in Code-Switching Social Media Posts — single-notebook model pipeline (thesis)"
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "transformers>=4.51,<5",
    "sentence-transformers>=4.1",
    "datasets>=3.5",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "pyarrow>=19",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "sentencepiece>=0.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "jupytext>=1.16",
    "nbformat>=5.10",
]

[project.optional-dependencies]
# demo/ only — the pipeline itself never imports these (FABILE_BRIEF §5)
demo = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
explore = [
    "protobuf>=4",
]

[tool.uv]
# dependency-only project: the whole pipeline lives in leische_pipeline.ipynb
package = false

[tool.uv.sources]
# cu128, not cu124: the RTX 5090 is Blackwell (sm_120) and the cu124 wheels
# are built only up to sm_90 — they fail at the first kernel launch.
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
